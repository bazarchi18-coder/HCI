<!DOCTYPE html>
<html lang="en" data-theme="light" data-contrast="normal" data-font-scale="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SoundBridge — Communication & Accessibility App</title>
  <meta name="description" content="SoundBridge helps people with partial hearing loss communicate through real-time captions, sound alerts, quick reply cards, and ambient noise monitoring.">
  <meta name="theme-color" content="#1A6B8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%231A6B8A'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>🔊</text></svg>">
</head>
<body>

  <div id="app" class="app">

    <!-- ═══ App Header ═══ -->
    <header id="app-header" class="app-header hidden" role="banner">
      <button id="btn-back" class="header-btn hidden" aria-label="Go back">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
      <h1 id="header-title" class="header-title"></h1>
      <div id="header-actions" class="header-actions"></div>
    </header>

    <!-- ═══ Screen Container ═══ -->
    <main id="screen-container" class="screen-container" role="main"></main>

    <!-- ═══ Bottom Navigation ═══ -->
    <nav id="bottom-nav" class="bottom-nav hidden" role="navigation" aria-label="Main navigation">
      <button class="nav-item" data-screen="screen-dashboard" aria-label="Home">
        <span class="material-symbols-rounded">home</span>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-screen="screen-caption-ready" aria-label="Live Caption">
        <span class="material-symbols-rounded">mic</span>
        <span class="nav-label">Caption</span>
      </button>
      <button class="nav-item" data-screen="screen-reply-home" aria-label="Quick Reply Cards">
        <span class="material-symbols-rounded">chat</span>
        <span class="nav-label">Cards</span>
      </button>
      <button class="nav-item" data-screen="screen-meter" aria-label="Ambient Noise Meter">
        <span class="material-symbols-rounded">equalizer</span>
        <span class="nav-label">Meter</span>
      </button>
      <button class="nav-item" data-screen="screen-settings-profile" aria-label="Settings">
        <span class="material-symbols-rounded">settings</span>
        <span class="nav-label">Settings</span>
      </button>
    </nav>

    <!-- ═══ Toast Container ═══ -->
    <div id="toast-container" class="toast-container" role="alert" aria-live="polite"></div>

    <!-- ═══ Modal Overlay ═══ -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div id="modal-content" class="modal-content"></div>
    </div>

  </div>

  <!-- ═══ Scripts ═══ -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modules/onboarding.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/liveCaption.js"></script>
  <script src="js/modules/soundAlerts.js"></script>
  <script src="js/modules/quickReply.js"></script>
  <script src="js/modules/ambientMeter.js"></script>
  <script src="js/modules/mediaCaptions.js"></script>
  <script src="js/modules/settings.js"></script>

</body>
</html>
